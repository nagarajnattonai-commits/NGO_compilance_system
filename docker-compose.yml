services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    volumes:
      - compliance-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    build: ./apps/api
    command: ["python", "-m", "app.runtime_scheduler", "--loop", "--interval", "60"]
    volumes:
      - compliance-data:/app/data
    depends_on:
      api:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.automation_worker", "--loop"]
    volumes:
      - compliance-data:/app/data
    depends_on:
      api:
        condition: service_healthy

  integration-worker:
    build: ./apps/api
    command: ["python", "-m", "app.integration_worker", "--loop"]
    volumes:
      - compliance-data:/app/data
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  compliance-data:
