name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run API test suite
        run: python -m pytest

  frontend:
    name: Web type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run TypeScript validation
        run: npm run lint
      - name: Build production web application
        run: npm run build

  compose:
    name: Container configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate Docker Compose
        env:
          PLATFORM_DOMAIN: ci.example.org
          WHITE_LABEL_CNAME_TARGET: edge-ci.example.org
          ACME_EMAIL: ci@example.org
          PLATFORM_ADMIN_EMAILS: operator@example.org
          BRAND_PROXY_KEY: ci-only-brand-proxy-key-000000000000
          POSTGRES_PASSWORD: ci-only-password
          BRAND_S3_BUCKET: ci-private-brand-assets
          DOCUMENT_S3_BUCKET: ci-private-documents
        run: |
          docker compose config --quiet
          docker compose -f deploy/compose.white-label.yml config --quiet

  release-readiness:
    name: Production release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: production
      APP_ORIGIN: https://ci.example.org
      PLATFORM_HOSTS: ci.example.org
      WHITE_LABEL_CNAME_TARGET: edge-ci.example.org
      BRAND_PROXY_KEY: ci-only-brand-proxy-key-000000000000
      PLATFORM_ADMIN_EMAILS: operator@example.org
      DATABASE_URL: postgresql+psycopg://compliance:ci-only-password@127.0.0.1:5432/compliance
      INTEGRATION_SECRET_BACKEND: aws
      BRAND_S3_BUCKET: ci-private-brand-assets
      DOCUMENT_S3_BUCKET: ci-private-documents
      DOCUMENT_SCAN_REQUIRED: "false"
      RELEASE_VERSION: ci
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run focused production controls
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///:memory:
        run: python -m pytest tests/test_phase25_production.py tests/test_phase18_security.py
      - name: Rehearse empty PostgreSQL bootstrap and integrity check
        working-directory: apps/api
        run: |
          python -m app.bootstrap_schema --apply
          python -m app.production_ops --check
      - name: Verify production API health and readiness
        working-directory: apps/api
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/ready && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent http://127.0.0.1:8000/ready
      - name: Run release artifact guard
        run: python scripts/release-guard.py

  white-label-browser:
    name: White-label browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API test environment
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/python -m pip install -r apps/api/requirements.txt
      - name: Install website and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify branded UI and responsive layouts
        working-directory: apps/web
        run: npm run test:white-label
